spring:
  application:
    name: trading-assistant
  profiles:
    active: prod # profil actif par défaut, remplacé par "dev" en développement local

# Configuration JWT
# Le secret doit être une chaîne d'au moins 256 bits (32 caractères) pour HMAC-SHA256
# En production, injectez la valeur via variable d'environnement Docker : JWT_SECRET
jwt:
  secret: ${JWT_SECRET:cette-cle-secrete-doit-etre-changee-en-production-elle-doit-faire-au-moins-256-bits}
  expiration-ms: 86400000 # 24 heures

# Configuration Discord
discord:
  webhook-url: ${DISCORD_WEBHOOK_URL}
